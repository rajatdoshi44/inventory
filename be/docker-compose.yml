version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16  # यह ऑफिशियल इमेज है जिसमें Postgres 16 और pgvector दोनों शामिल हैं
    container_name: postgres_vector_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ai_inventory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
